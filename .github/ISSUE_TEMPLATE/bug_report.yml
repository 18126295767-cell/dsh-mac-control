name: Bug report
description: Report a reproducible problem without sharing private browser or desktop data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, API keys, cookies, recovery codes, browser profiles, or private screenshots. For security issues, use SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Plugin version or commit
      placeholder: 0.1.0 or full commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 14.6, Node.js 20.19.0, DSH 0.1.0-rc.7
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal command or tool call with all secrets and private URLs removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true

